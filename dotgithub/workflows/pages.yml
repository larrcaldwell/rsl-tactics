name: deploy-pages
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest commit, including data commits made by other workflows
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp data/*.json _site/data/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: dep
        uses: actions/deploy-pages@v4
