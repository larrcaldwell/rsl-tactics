name: verify-sources
# Phase 0. Run this first (Actions tab > verify-sources > Run workflow). It calls every data source for real
# and writes data/source_report.json plus data/samples/espn_stat_names.json. Re-run any time a source seems off.
on: { workflow_dispatch: }
permissions: { contents: write }
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Probe sources
        env: { API_FOOTBALL_KEY: '${{ secrets.API_FOOTBALL_KEY }}' }
        run: |
          python scripts/verify_sources.py | tee report.txt
          { echo '## Source check'; echo '```'; cat report.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Commit report
        run: |
          git config user.name "rsl-bot"; git config user.email "rsl-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "source report" && git pull --rebase && git push)
