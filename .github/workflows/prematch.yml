name: prematch
# Runs hourly. prematch.py --auto only acts about 6 hours and 1 hour before kickoff, otherwise exits in seconds.
# Run it by hand with a match id, or replay=true to build from the most recent completed match.
on:
  schedule: [{ cron: '23 * * * *' }]
  workflow_dispatch:
    inputs:
      match_id: { description: 'ESPN event id (optional)', required: false }
      replay:   { description: 'Use most recent completed match', required: false, default: 'false' }
permissions: { contents: write }
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    outputs: { changed: '${{ steps.c.outputs.changed }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Build matchup
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS=""
            [ -n "${{ inputs.match_id }}" ] && ARGS="--match-id ${{ inputs.match_id }}"
            [ "${{ inputs.replay }}" = "true" ] && ARGS="$ARGS --replay"
            python scripts/prematch.py $ARGS
          else
            python scripts/prematch.py --auto
          fi
      - id: c
        name: Commit data
        run: |
          git config user.name "rsl-bot"; git config user.email "rsl-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT; else
            git commit -m "prematch" && git pull --rebase && git push && echo "changed=true" >> $GITHUB_OUTPUT; fi
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions: { contents: read, pages: write, id-token: write }
    uses: ./.github/workflows/pages.yml
